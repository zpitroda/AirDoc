<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="AirDoc Mark">

  <defs>
    <linearGradient id="mark_primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="mark_wing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="mark_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base Clinical Cross (Vertical & Horizontal Tapered Rounded Bars) -->
  <rect x="19" y="5" width="10" height="38" rx="5" fill="url(#mark_primary)" />
  <rect x="5" y="19" width="38" height="10" rx="5" fill="url(#mark_primary)" />

  <!-- Aerodynamic Forward-Lift Wing (Airfoil Curve) -->
  <path d="M 5 33 
           C 12 32, 19 28, 24 24 
           C 29 20, 36 13, 44 9 
           C 39 16, 32 23, 27 27 
           C 21 32, 13 36, 5 33 Z" 
        fill="url(#mark_wing)" 
        filter="url(#mark_shadow)" />

  <!-- Secondary Airfoil Highlight Accent -->
  <path d="M 12 11 
           C 17 14, 21 17, 24 19 
           C 20 18, 16 16, 12 11 Z" 
        fill="#38BDF8" 
        opacity="0.8" />

  <!-- Central Clinical Pulse Node -->
  <circle cx="24" cy="24" r="2.8" fill="#FFFFFF" />
  <circle cx="24" cy="24" r="1.5" fill="#0284C7" />

</svg>